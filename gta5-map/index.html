<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GTA V Map Collectibles</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
    <!-- FontAwesome for Vector Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <!-- Mobile Toggle Button -->
        <button id="mobile-sidebar-toggle"><i class="fas fa-list"></i> Menu & Sync</button>

        <div id="sidebar">
            <div class="sidebar-header">
                <h2>GTA V Collectibles</h2>
                <button id="mobile-sidebar-close"><i class="fas fa-times"></i></button>
            </div>
            
            <div id="cloud-sync-panel">
                <h4><i class="fas fa-save"></i> Save Code</h4>
                <p>Copy this code to move your progress to another device.</p>
                <textarea id="sync-id" placeholder="Paste your save code here..." rows="3" style="width:100%; resize:none; margin-bottom:5px; padding:5px; border-radius:4px; background:#0f1419; color:white; border:1px solid #2c3e50; font-family:monospace; font-size:11px;"></textarea>
                <div class="sync-row" style="display:flex; gap:10px;">
                    <button id="btn-sync-new" style="flex:1; background:#2ecc71; color:white;"><i class="fas fa-copy"></i> Copy Code</button>
                    <button id="btn-sync-pull" style="flex:1; background:#3498db; color:white;"><i class="fas fa-file-import"></i> Load Code</button>
                </div>
                <div id="sync-status" style="text-align:center; font-size:12px; margin-top:5px; color:#2ecc71;"></div>
            </div>
            
            <div class="controls">
                <label>Map Style:</label>
                <select id="map-style-select">
                    <option value="atlas">Atlas</option>
                    <option value="satellite">Satellite</option>
                    <option value="roadmap">Road Map</option>
                </select>
            </div>

            <div class="filter-controls">
                <button id="btn-show-all">Show All</button>
                <button id="btn-hide-all">Hide All</button>
            </div>

            <div id="category-list">
                <!-- Categories populated here by app.js -->
            </div>
        </div>
        <div id="map-container">
            <div id="map"></div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <script src="app.js"></script>
</body>
</html>
