<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GTA V Map Collectibles</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
    <!-- FontAwesome for Vector Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <!-- Mobile Toggle Button -->
        <button id="mobile-sidebar-toggle"><i class="fas fa-list"></i> Menu & Sync</button>

        <div id="sidebar">
            <div class="sidebar-header">
                <h2>GTA V Collectibles</h2>
                <button id="mobile-sidebar-close"><i class="fas fa-times"></i></button>
            </div>
            
            <div id="cloud-sync-panel">
                <h4><i class="fas fa-cloud"></i> Cloud Sync</h4>
                <p>Sync progress between phone and PC!</p>
                <div class="sync-row">
                    <input type="text" id="sync-id" placeholder="Paste Sync ID here...">
                    <button id="btn-sync-pull"><i class="fas fa-download"></i></button>
                </div>
                <div class="sync-row">
                    <button id="btn-sync-new">Create New ID</button>
                    <span id="sync-status"></span>
                </div>
            </div>
            
            <div class="controls">
                <label>Map Style:</label>
                <select id="map-style-select">
                    <option value="atlas">Atlas</option>
                    <option value="satellite">Satellite</option>
                    <option value="roadmap">Road Map</option>
                </select>
            </div>

            <div class="filter-controls">
                <button id="btn-show-all">Show All</button>
                <button id="btn-hide-all">Hide All</button>
            </div>

            <div id="category-list">
                <!-- Categories populated here by app.js -->
            </div>
        </div>
        <div id="map-container">
            <div id="map"></div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <script src="app.js"></script>
</body>
</html>
