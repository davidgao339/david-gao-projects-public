<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTA V Map Collectibles</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <div id="sidebar">
            <h2>GTA V Collectibles</h2>
            
            <div id="cloud-sync-panel">
                <h4>☁️ Cloud Sync</h4>
                <p>Sync progress between phone and PC!</p>
                <div class="sync-row">
                    <input type="text" id="sync-id" placeholder="Paste Sync ID here...">
                    <button id="btn-sync-pull">Download</button>
                </div>
                <div class="sync-row">
                    <button id="btn-sync-new">Create New Sync ID</button>
                    <span id="sync-status"></span>
                </div>
            </div>
            
            <div class="controls">
                <label>Map Style:</label>
                <select id="map-style-select">
                    <option value="atlas">Atlas</option>
                    <option value="satellite">Satellite</option>
                    <option value="roadmap">Road Map</option>
                </select>
            </div>

            <div id="category-list">
                <!-- Categories and markers populated here by app.js -->
            </div>
        </div>
        <div id="map-container">
            <div id="map"></div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <script src="app.js"></script>
</body>
</html>
